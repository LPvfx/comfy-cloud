[project]
name = "comfy-cloud"
version = "0.1.0"
description = "ComfyUI on a rented Vast.ai GPU, driven from your Mac"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["vastai>=1.0", "rich>=13", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
comfy-cloud = "comfy_cloud.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfy_cloud"]
